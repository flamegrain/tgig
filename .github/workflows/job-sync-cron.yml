name: Scheduled Job Sync & Health Check

on:
  schedule:
    # Runs every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
    - cron: '0 */6 * * *'
  workflow_dispatch: # Allows one-click manual execution from GitHub Actions tab

permissions:
  contents: write

jobs:
  sync-and-health-check:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Execute Sync & Link Health-Check Engine
        run: node scripts/sync-jobs.cjs

      - name: Commit and Push Updated Job Statuses
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/realJobs.ts scripts/sync-report.json
          if git diff --staged --quiet; then
            echo "✅ No status changes detected. All jobs are healthy and verified."
          else
            echo "⚡ Changes detected. Committing updated job data..."
            git commit -m "chore(data): auto-sync student jobs and prune expired listings [skip ci]"
            git push origin main
          fi
